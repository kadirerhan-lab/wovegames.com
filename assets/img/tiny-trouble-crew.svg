<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttc-title">
  <title id="ttc-title">Three tiny helmets in red, blue and yellow peeking over the edge of a giant kitchen table</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3DF"/><stop offset="1" stop-color="#FFE0C2"/></linearGradient>
    <clipPath id="frame"><rect width="800" height="450"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="800" height="450" fill="url(#sky)"/>
    <!-- giant cookie and crumbs -->
    <circle cx="640" cy="130" r="92" fill="#D99A5B"/>
    <circle cx="640" cy="130" r="80" fill="#E8B06E"/>
    <g fill="#5B3A29"><circle cx="612" cy="104" r="9"/><circle cx="660" cy="92" r="7"/><circle cx="676" cy="146" r="10"/><circle cx="628" cy="158" r="7"/><circle cx="650" cy="126" r="6"/></g>
    <circle cx="150" cy="120" r="12" fill="#E8B06E"/><circle cx="196" cy="86" r="7" fill="#E8B06E"/><circle cx="100" cy="76" r="6" fill="#E8B06E"/>
    <!-- honey drip -->
    <path d="M300 0h130v60c0 28-14 48-30 48s-20-30-36-30c-18 0-22 54-44 54-14 0-20-18-20-40z" fill="#F7C948" opacity=".9"/>
    <!-- table edge -->
    <rect y="330" width="800" height="120" fill="#C7794A"/>
    <rect y="330" width="800" height="18" fill="#E09A66"/>
    <!-- three helmets peeking over the table -->
    <g>
      <path d="M190 330a70 70 0 0 1 140 0z" fill="#E8453C"/>
      <rect x="180" y="316" width="160" height="22" rx="11" fill="#C9332B"/>
      <circle cx="260" cy="296" r="12" fill="#fff"/><circle cx="263" cy="298" r="5" fill="#22304A"/>
    </g>
    <g>
      <path d="M330 330a70 70 0 0 1 140 0z" fill="#2F7BD9"/>
      <rect x="320" y="316" width="160" height="22" rx="11" fill="#245FAF"/>
      <circle cx="400" cy="296" r="12" fill="#fff"/><circle cx="402" cy="298" r="5" fill="#22304A"/>
    </g>
    <g>
      <path d="M470 330a70 70 0 0 1 140 0z" fill="#F7C948"/>
      <rect x="460" y="316" width="160" height="22" rx="11" fill="#E0A800"/>
      <circle cx="540" cy="296" r="12" fill="#fff"/><circle cx="537" cy="298" r="5" fill="#22304A"/>
    </g>
    <!-- motion stars -->
    <g fill="#F26B4E"><path d="M90 230l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/><path d="M730 260l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
  </g>
</svg>
